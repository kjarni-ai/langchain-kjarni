[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-kjarni"
version = "0.1.0"
description = "LangChain integration for Kjarni: local embeddings in your own process, with no PyTorch, no ONNX Runtime and no server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ólafur Aron Jóhannsson" }]
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3,<2", "kjarni>=0.2.3"]
keywords = ["langchain", "embeddings", "kjarni", "local", "offline", "rag", "sentence-transformers"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://kjarni.ai"
Source = "https://github.com/olafurjohannsson/langchain-kjarni"
Documentation = "https://kjarni.ai/docs/"

[project.optional-dependencies]
test = ["langchain-tests>=1.0", "pytest>=8", "pytest-asyncio>=0.23", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_kjarni"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["requires: integration tests that load a real model"]
